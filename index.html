<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Feliz Aniversário, Meu Amor</title>

    <link rel="shortcut icon" href="fotos/favicon.ico" type="image/x-icon">

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>

    <main class="pagina">

        <!-- TÍTULO -->
        <section class="mensagem">

            <span class="coracao">&#x2764;&#xFE0E;</span>

            <p class="pequeno">
                Hoje é um dia muito especial...
            </p>

            <h1>
                Feliz aniversário,<br>
                <span>meu amor!</span>
            </h1>

            <p class="texto">
                Que seu novo ciclo seja cheio de momentos felizes,
                sonhos realizados e muitos motivos para sorrir.
                Sou muito feliz por poder compartilhar a vida com você.
            </p>

            <p class="assinatura">
                Com todo meu amor 
            </p>

        </section>


        <!-- ROLO FOTOGRÁFICO -->
        <section class="foto-container">

            <div class="perfuracao esquerda"></div>

            <div class="fotos">

                <div class="foto">
                    <img id="foto1" src="fotos/foto1.jpg" alt="Nossa foto">
                </div>

                <div class="foto">
                    <img id="foto2" src="fotos/foto2.jpg" alt="Nossa foto">
                </div>

                <div class="foto">
                    <img id="foto3" src="fotos/foto3.jpg" alt="Nossa foto">
                </div>

            </div>

            <div class="perfuracao direita"></div>

        </section>

        <section class="mensagem">
            <h1><span>EU TE AMO MUITO &#x2764;&#xFE0E;</span></h1>
        </section>

    </main>

    <!-- DECORAÇÕES -->
    <div class="decoracao coracao-1">&#x2764;&#xFE0E;</div>
    <div class="decoracao coracao-2">&#x2764;&#xFE0E;</div>
    <div class="decoracao coracao-3">&#x2764;&#xFE0E;</div>

    <script src="script.js"></script>
</body>

</html>
